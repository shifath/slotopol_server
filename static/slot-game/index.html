<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Game</title>
    <link rel="stylesheet" href="/static/slot-game/style.css">
</head>
<body>
    <div>
    <div class="slot-machine">
            <div class="reels">
                <div class="reel" id="reel1"></div>
                <div class="reel" id="reel2"></div>
                <div class="reel" id="reel3"></div>
                <div class="reel" id="reel4"></div>
                <div class="reel" id="reel5"></div>
            </div>
            <div class="game-info">
                <p>Balance: $<span id="balance">0.00</span></p>
                <p>Last Win: $<span id="last-win">0.00</span></p>
            </div>
            <div id="game-status" class="status-message"></div>

            <div class="controls">
                <button class="back-button" onclick="window.location.href='/static/index.html'">Lobby</button>
                <div class="line-buttons">
                    <button class="line-button" data-lines="1">1 Line</button>
                    <button class="line-button" data-lines="3">3 Lines</button>
                    <button class="line-button" data-lines="5">5 Lines</button>
                    <button class="line-button" data-lines="8">8 Lines</button>
                    <button class="line-button" data-lines="10">10 Lines</button>
                </div>
                <button id="spinButton">Spin</button>
            </div>

    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
