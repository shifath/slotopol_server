<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Launcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="launcher-container">
        <h1>Launch Your Game</h1>
        <p>Selected Game: <span id="game-alias"></span></p>
        <button id="startGameButton">Start Game</button>
        <button id="addCoinsButton">Add 1000 Coins (Test)</button>
        <div id="status-message"></div>
        <div id="wallet-status-message" style="color: blue; margin-top: 10px;"></div>
        <a href="/static/index.html">Back to Lobby</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
